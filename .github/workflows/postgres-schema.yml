name: PostgreSQL schema

on:
  push:
  pull_request:

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: andromeda_test
          POSTGRES_USER: andromeda
          POSTGRES_PASSWORD: andromeda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andromeda -d andromeda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://andromeda:andromeda_test@localhost:5432/andromeda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: First clean upgrade
        run: python -m alembic upgrade head
      - name: Full PostgreSQL test suite
        run: python -m pytest -q
      - name: Verify ORM and database metadata
        run: python -m alembic check
      - name: Downgrade to base
        run: python -m alembic downgrade base
      - name: Rebuild schema from base
        run: python -m alembic upgrade head
      - name: Repeat full PostgreSQL test suite
        run: python -m pytest -q
      - name: Verify metadata after rebuild
        run: python -m alembic check
