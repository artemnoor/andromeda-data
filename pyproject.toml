[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-backend"
version = "0.1.0"
description = "Andromeda admissions data backend and PostgreSQL schema"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: uses a real PostgreSQL database",
    "migration: performs destructive Alembic migration round trips",
]

[tool.setuptools.packages.find]
where = ["src"]
